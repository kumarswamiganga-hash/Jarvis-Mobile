<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030914" />
  <title>J.A.R.V.I.S. // Mobile HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #030914;
      --bg-panel: rgba(8, 22, 44, 0.72);
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.25);
      --cyan-glow: 0 0 15px rgba(0, 240, 255, 0.55);
      --amber: #ffae00;
      --danger: #ff3b5c;
      --text-main: #e6f7ff;
      --text-muted: #6ea8c9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .hud-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .hud-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 10px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cyan-dim);
      padding-bottom: 8px;
    }

    .brand-tag {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      display: block;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.35rem;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: var(--cyan-glow);
    }

    .telemetry { display: flex; align-items: center; gap: 8px; }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 8px;
      border: 1px solid var(--cyan);
      border-radius: 4px;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
    }

    .hud-btn-sm {
      background: transparent;
      border: 1px solid var(--cyan-dim);
      color: var(--text-muted);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 4px;
      cursor: pointer;
    }

    .hud-btn-sm:hover { border-color: var(--danger); color: var(--danger); }

    .core-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
    }

    .arc-reactor {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }

    .outer-ring {
      width: 112px; height: 112px;
      border-top-color: var(--cyan);
      border-bottom-color: var(--cyan);
      box-shadow: var(--cyan-glow);
      animation: spinCW 8s linear infinite;
    }

    .mid-ring {
      width: 86px; height: 86px;
      border-left-color: var(--cyan);
      border-right-color: var(--cyan);
      border-style: dashed;
      animation: spinCCW 5s linear infinite;
    }

    .inner-ring {
      width: 62px; height: 62px;
      border: 2px solid var(--cyan-dim);
      box-shadow: inset 0 0 12px var(--cyan);
    }

    .core-center {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #80f8ff 0%, #00b8d4 60%, #004d66 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--cyan);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .core-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      color: #021019;
    }

    .arc-reactor.listening .outer-ring {
      border-top-color: var(--danger);
      border-bottom-color: var(--danger);
      animation-duration: 2s;
    }
    .arc-reactor.listening .core-center {
      background: radial-gradient(circle, #ff9eb0 0%, var(--danger) 70%);
      box-shadow: 0 0 25px var(--danger);
      transform: scale(1.12);
    }

    .arc-reactor.speaking .outer-ring,
    .arc-reactor.thinking .outer-ring { animation-duration: 1.5s; }
    .arc-reactor.speaking .core-center { animation: pulseCore 0.6s infinite alternate; }

    .assistant-state {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    .sub-metrics {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .sub-metrics b { color: var(--text-main); }

    .chat-panel {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--cyan-dim);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--cyan-dim);
      background: rgba(0, 240, 255, 0.04);
    }

    .live-dot { color: #00ff88; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message { display: flex; align-items: flex-start; gap: 9px; max-width: 88%; }
    .user-message { align-self: flex-end; }
    .assistant-message { align-self: flex-start; }

    .message-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center
