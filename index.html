<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030914" />
  <title>J.A.R.V.I.S. // Mobile HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #030914;
      --bg-panel: rgba(8, 22, 44, 0.72);
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.25);
      --cyan-glow: 0 0 15px rgba(0, 240, 255, 0.55);
      --amber: #ffae00;
      --danger: #ff3b5c;
      --text-main: #e6f7ff;
      --text-muted: #6ea8c9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .hud-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .hud-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 10px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cyan-dim);
      padding-bottom: 8px;
    }

    .brand-tag {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      display: block;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.35rem;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: var(--cyan-glow);
    }

    .telemetry { display: flex; align-items: center; gap: 8px; }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 8px;
      border: 1px solid var(--cyan);
      border-radius: 4px;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
    }

    .hud-btn-sm {
      background: transparent;
      border: 1px solid var(--cyan-dim);
      color: var(--text-muted);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 4px;
      cursor: pointer;
    }

    .hud-btn-sm:hover { border-color: var(--danger); color: var(--danger); }

    .core-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
    }

    .arc-reactor {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }

    .outer-ring {
      width: 112px; height: 112px;
      border-top-color: var(--cyan);
      border-bottom-color: var(--cyan);
      box-shadow: var(--cyan-glow);
      animation: spinCW 8s linear infinite;
    }

    .mid-ring {
      width: 86px; height: 86px;
      border-left-color: var(--cyan);
      border-right-color: var(--cyan);
      border-style: dashed;
      animation: spinCCW 5s linear infinite;
    }

    .inner-ring {
      width: 62px; height: 62px;
      border: 2px solid var(--cyan-dim);
      box-shadow: inset 0 0 12px var(--cyan);
    }

    .core-center {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, #80f8ff 0%, #00b8d4 60%, #004d66 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--cyan);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .core-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      color: #021019;
    }

    .arc-reactor.listening .outer-ring {
      border-top-color: var(--danger);
      border-bottom-color: var(--danger);
      animation-duration: 2s;
    }
    .arc-reactor.listening .core-center {
      background: radial-gradient(circle, #ff9eb0 0%, var(--danger) 70%);
      box-shadow: 0 0 25px var(--danger);
      transform: scale(1.12);
    }

    .arc-reactor.speaking .outer-ring,
    .arc-reactor.thinking .outer-ring { animation-duration: 1.5s; }
    .arc-reactor.speaking .core-center { animation: pulseCore 0.6s infinite alternate; }

    .assistant-state {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    .sub-metrics {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .sub-metrics b { color: var(--text-main); }

    .chat-panel {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--cyan-dim);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--cyan-dim);
      background: rgba(0, 240, 255, 0.04);
    }

    .live-dot { color: #00ff88; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message { display: flex; align-items: flex-start; gap: 9px; max-width: 88%; }
    .user-message { align-self: flex-end; }
    .assistant-message { align-self: flex-start; }

    .message-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cyan);
      flex-shrink: 0;
      background: rgba(0, 240, 255, 0.1);
    }

    .user-message .message-avatar {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(255, 174, 0, 0.1);
    }

    .message-content {
      background: rgba(0, 240, 255, 0.07);
      border: 1px solid var(--cyan-dim);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .user-message .message-content {
      background: rgba(255, 174, 0, 0.08);
      border-color: rgba(255, 174, 0, 0.3);
    }

    .message-name {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--cyan);
      margin-bottom: 2px;
    }
    .user-message .message-name { color: var(--amber); }
    .message-content p { font-size: 0.96rem; line-height: 1.4; white-space: pre-wrap; }

    .command-dock { padding-top: 2px; }

    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
    }

    .mic-btn {
      width: 42px; height: 42px;
      border-radius: 6px;
      border: 1px solid var(--cyan-dim);
      background: rgba(0, 240, 255, 0.1);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .mic-btn.listening {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      box-shadow: 0 0 15px var(--danger);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      padding: 6px;
    }

    #user-input::placeholder { color: var(--text-muted); }

    .send-btn {
      height: 42px;
      padding: 0 16px;
      border-radius: 6px;
      border: none;
      background: var(--cyan);
      color: #021019;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulseCore { from { transform: scale(0.95); } to { transform: scale(1.15); } }
  </style>
</head>
<body>
  <div class="hud-grid"></div>
  <div class="hud-container">
    <header class="hud-header">
      <div class="brand">
        <span class="brand-tag">STARK INDUSTRIES // MK-VII</span>
        <h1>J.A.R.V.I.S.</h1>
      </div>
      <div class="telemetry">
        <div class="status-pill" id="status-indicator">CONNECTING...</div>
        <button id="clear-memory-btn" class="hud-btn-sm" title="Clear Memory">PURGE MEM</button>
      </div>
    </header>

    <section class="core-section">
      <div class="arc-reactor" id="arc-reactor">
        <div class="ring outer-ring"></div>
        <div class="ring mid-ring"></div>
        <div class="ring inner-ring"></div>
        <div class="core-center"><span class="core-label">AI</span></div>
      </div>
      <div class="assistant-state" id="assistant-status">INITIALIZING SYSTEMS</div>
      <div class="sub-metrics">
        <span>ENGINE: <b>GEMINI</b></span>
        <span>•</span>
        <span>VOICE: <b>ELEVENLABS</b></span>
        <span>•</span>
        <span>KV: <b>ACTIVE</b></span>
      </div>
    </section>

    <main class="chat-panel">
      <div class="panel-header">
        <span>LIVE INTELLIGENCE LOG</span>
        <span class="live-dot">● ONLINE</span>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message assistant-message">
          <div class="message-avatar">J</div>
          <div class="message-content">
            <span class="message-name">JARVIS</span>
            <p>Welcome back, Sir. All systems are online and calibrated. How may I assist you?</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="command-dock">
      <form id="chat-form" class="input-bar">
        <button type="button" id="mic-button" class="mic-btn" aria-label="Voice Command">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 0 0-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
          </svg>
        </button>
        <input type="text" id="user-input" placeholder="Enter command or tap mic, Sir..." autocomplete="off" />
        <button type="submit" id="send-button" class="send-btn">SEND</button>
      </form>
    </footer>
  </div>

  <script>
    const API_BASE = "https://jarvis-ai-brain.kumarswamiganga.workers.dev";
    const VOICE_LANGUAGE = "en-IN";
    const MEMORY_KEY = "JARVIS_CONVERSATION_MEMORY";
    const CLOUD_MEMORY_KEY = "JARVIS_CLOUD_MEMORY_ID";

    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const chatMessages = document.getElementById("chat-messages");
    const micButton = document.getElementById("mic-button");
    const sendButton = document.getElementById("send-button");
    const statusIndicator = document.getElementById("status-indicator");
    const assistantStatus = document.getElementById("assistant-status");
    const arcReactor = document.getElementById("arc-reactor");
    const clearMemoryBtn = document.getElementById("clear-memory-btn");

    let conversationMemory = loadLocalMemory();
    let recognition = null;
    let isListening = false;
    let isBusy = false;

    function loadLocalMemory() {
      try {
        const saved = JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]");
        return Array.isArray(saved) ? saved.slice(-30) : [];
      } catch {
        return [];
      }
    }

    function saveLocalMemory() {
      localStorage.setItem(MEMORY_KEY, JSON.stringify(conversationMemory.slice(-30)));
    }

    function setStatus(message, mode = "idle") {
      if (assistantStatus) assistantStatus.textContent = message.toUpperCase();
      if (arcReactor) {
        arcReactor.classList.remove("listening", "thinking", "speaking");
        if (mode !== "idle") arcReactor.classList.add(mode);
      }
    }

    function renderBubble(message, sender) {
      const row = document.createElement("div");
      row.className = `message ${sender === "user" ? "user-message" : "assistant-message"}`;

      const avatar = document.createElement("div");
      avatar.className = "message-avatar";
      avatar.textContent = sender === "user" ? "S" : "J";

      const content = document.createElement("div");
      content.className = "message-content";

      const name = document.createElement("span");
      name.className = "message-name";
      name.textContent = sender === "user" ? "SIR" : "JARVIS";

      const paragraph = document.createElement("p");
      paragraph.textContent = message;

      content.appendChild(name);
      content.appendChild(paragraph);

      if (sender === "user") {
        row.appendChild(content);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(content);
      }

      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMessage(message, sender) {
      renderBubble(message, sender);
      conversationMemory.push({
        role: sender === "user" ? "user" : "assistant",
        content: message,
      });
      conversationMemory = conversationMemory.slice(-30);
      saveLocalMemory();
      syncCloudMemory();
    }

    function buildGeminiContext() {
      return conversationMemory.slice(-20).map((item) => ({
        role: item.role,
        content: item.content,
      }));
    }

    async function sendMessage(message) {
      if (!message.trim() || isBusy) return;

      isBusy = true;
      userInput.value = "";
      sendButton.disabled = true;

      addMessage(message, "user");
      setStatus("Processing command...", "thinking");

      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: buildGeminiContext(),
            memoryId: localStorage.getItem(CLOUD_MEMORY_KEY),
          }),
        });

        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || "AI service unavailable.");
        }

        const reply = data.reply || data.response || data.message;
        if (!reply) throw new Error("Empty response from JARVIS.");

        addMessage(reply, "assistant");
        await speakMessage(reply);
      } catch (error) {
        console.error("JARVIS error:", error);
        addMessage(`Core Error: ${error.message}`, "assistant");
        setStatus("Connection problem", "idle");
      } finally {
        isBusy = false;
        sendButton.disabled = false;
        userInput.focus();
      }
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(userInput.value);
    });

    async function speakMessage(message) {
      try {
        setStatus("Speaking", "speaking");
        const response = await fetch(`${API_BASE}/speak`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message }),
        });

        if (!response.ok) throw new Error("ElevenLabs unavailable");

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);

        audio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          setStatus("Awaiting your command", "idle");
        };
        audio.onerror = () => {
          URL.revokeObjectURL(audioUrl);
          setStatus("Awaiting your command", "idle");
        };

        await audio.play();
      } catch (error) {
        if ("speechSynthesis" in window) {
          const utter = new SpeechSynthesisUtterance(message);
          utter.rate = 1.02;
          utter.pitch = 0.95;
          utter.onend = () => setStatus("Awaiting your command", "idle");
          window.speechSynthesis.speak(utter);
        } else {
          setStatus("Awaiting your command", "idle");
        }
      }
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micButton.disabled = true;
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = VOICE_LANGUAGE;
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micButton.classList.add("listening");
        setStatus("Listening...", "listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        sendMessage(transcript);
      };

      recognition.onerror = () => setStatus("Microphone error", "idle");

      recognition.onend = () => {
        isListening = false;
        micButton.classList.remove("listening");
        if (!isBusy) setStatus("Awaiting your command", "idle");
      };
    }

    micButton.addEventListener("click", () => {
      if (!recognition) {
        alert("Voice recognition requires Chrome or Edge.");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch (e) {}
      }
    });

    async function syncCloudMemory() {
      const memoryId = localStorage.getItem(CLOUD_MEMORY_KEY);
      try {
        const response = await fetch(`${API_BASE}/memory`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "save",
            memoryId,
            history: conversationMemory.slice(-30),
          }),
        });
        const data = await response.json();
        if (data.success && data.memoryId) {
          localStorage.setItem(CLOUD_MEMORY_KEY, data.memoryId);
        }
      } catch (e) {}
    }

    async function loadCloudMemory() {
      const memoryId = localStorage.getItem(CLOUD_MEMORY_KEY);
      if (!memoryId) return;
      try {
        const response = await fetch(`${API_BASE}/memory`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "load", memoryId }),
        });
        const data = await response.json();
        if (data.success && Array.isArray(data.history) && data.history.length) {
          conversationMemory = data.history.slice(-30);
          saveLocalMemory();
        }
      } catch (e) {}
    }

    function restoreChat() {
      if (!conversationMemory.length) return;
      chatMessages.innerHTML = "";
      conversationMemory.slice(-20).forEach((item) => {
        renderBubble(item.content, item.role === "user" ? "user" : "assistant");
      });
    }

    clearMemoryBtn.addEventListener("click", () => {
      localStorage.removeItem(MEMORY_KEY);
      localStorage.removeItem(CLOUD_MEMORY_KEY);
      conversationMemory = [];
      chatMessages.innerHTML = "";
      renderBubble("Memory banks purged, Sir. Ready for new directives.", "assistant");
    });

    async function initializeJarvis() {
      setupSpeechRecognition();
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        statusIndicator.textContent = data.success ? "SYSTEM ONLINE" : "CHECK WORKER";
      } catch {
        statusIndicator.textContent = "OFFLINE";
      }

      await loadCloudMemory();
      restoreChat();
      setStatus("Awaiting your command", "idle");
    }

    initializeJarvis();
  </script>
</body>
</html>
