<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030914" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <title>J.A.R.V.I.S. // Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #030914;
      --bg-panel: rgba(8, 22, 44, 0.78);
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.25);
      --cyan-glow: 0 0 15px rgba(0, 240, 255, 0.55);
      --amber: #ffae00;
      --danger: #ff3b5c;
      --green: #00ff88;
      --text-main: #e6f7ff;
      --text-muted: #6ea8c9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    .hud-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    .hud-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      gap: 8px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cyan-dim);
      padding-bottom: 7px;
      gap: 6px;
    }
    .brand-tag { font-size: 0.62rem; letter-spacing: 1.5px; color: var(--text-muted); display: block; }
    .brand h1 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; letter-spacing: 2px; color: var(--cyan); text-shadow: var(--cyan-glow); }
    .telemetry { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .status-pill {
      font-size: 0.64rem;
      font-weight: 700;
      padding: 3px 6px;
      border: 1px solid var(--cyan);
      border-radius: 4px;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
    }
    .hud-btn-sm {
      background: transparent;
      border: 1px solid var(--cyan-dim);
      color: var(--text-muted);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .hud-btn-sm.active { border-color: var(--green); color: var(--green); background: rgba(0, 255, 136, 0.12); }
    .hud-btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }
    .core-section { display: flex; flex-direction: column; align-items: center; padding: 2px 0; }
    .arc-reactor {
      position: relative;
      width: 92px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      cursor: pointer;
    }
    .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
    .outer-ring { width: 92px; height: 92px; border-top-color: var(--cyan); border-bottom-color: var(--cyan); box-shadow: var(--cyan-glow); animation: spinCW 8s linear infinite; }
    .mid-ring { width: 70px; height: 70px; border-left-color: var(--cyan); border-right-color: var(--cyan); border-style: dashed; animation: spinCCW 5s linear infinite; }
    .inner-ring { width: 50px; height: 50px; border: 2px solid var(--cyan-dim); box-shadow: inset 0 0 12px var(--cyan); }
    .core-center {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle, #80f8ff 0%, #00b8d4 60%, #004d66 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--cyan);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .core-label { font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 900; color: #021019; }
    .arc-reactor.listening .outer-ring { border-top-color: var(--danger); border-bottom-color: var(--danger); animation-duration: 2s; }
    .arc-reactor.listening .core-center { background: radial-gradient(circle, #ff9eb0 0%, var(--danger) 70%); box-shadow: 0 0 25px var(--danger); transform: scale(1.12); }
    .arc-reactor.speaking .outer-ring, .arc-reactor.thinking .outer-ring { animation-duration: 1.5s; }
    .arc-reactor.speaking .core-center { animation: pulseCore 0.6s infinite alternate; }
    .assistant-state { font-family: 'Orbitron', sans-serif; font-size: 0.74rem; letter-spacing: 2px; color: var(--cyan); }
    .sub-metrics { font-size: 0.66rem; color: var(--text-muted); display: flex; gap: 6px; margin-top: 2px; }
    .sub-metrics b { color: var(--text-main); }
    .chat-panel {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--cyan-dim);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      padding: 6px 12px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--cyan-dim);
      background: rgba(0, 240, 255, 0.04);
    }
    .live-dot { color: var(--green); }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message { display: flex; align-items: flex-start; gap: 8px; max-width: 88%; }
    .user-message { align-self: flex-end; }
    .assistant-message { align-self: flex-start; }
    .message-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--cyan);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem; font-weight: 700;
      color: var(--cyan);
      flex-shrink: 0;
      background: rgba(0, 240, 255, 0.1);
    }
    .user-message .message-avatar { border-color: var(--amber); color: var(--amber); background: rgba(255, 174, 0, 0.1); }
    .message-content {
      background: rgba(0, 240, 255, 0.07);
      border: 1px solid var(--cyan-dim);
      padding: 7px 11px;
      border-radius: 8px;
    }
    .user-message .message-content { background: rgba(255, 174, 0, 0.08); border-color: rgba(255, 174, 0, 0.3); }
    .message-name { display: block; font-size: 0.64rem; font-weight: 700; letter-spacing: 1.5px; color: var(--cyan); margin-bottom: 2px; }
    .user-message .message-name { color: var(--amber); }
    .message-content p { font-size: 0.93rem; line-height: 1.38; white-space: pre-wrap; }
    .message-content img { max-width: 180px; border-radius: 6px; margin-top: 5px; border: 1px solid var(--cyan-dim); display: block; }
    .quick-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--cyan-dim);
      color: var(--cyan);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 14px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chip-btn:active { background: var(--cyan); color: #021019; }
    .command-dock { display: flex; flex-direction: column; gap: 6px; }
    .input-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-panel);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 5px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
    }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 6px;
      border: 1px solid var(--cyan-dim);
      background: rgba(0, 240, 255, 0.1);
      color: var(--cyan);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .icon-btn.listening { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px var(--danger); }
    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.96rem;
      padding: 5px;
      min-width: 0;
    }
    #user-input::placeholder { color: var(--text-muted); }
    .send-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      border: none;
      background: var(--cyan);
      color: #021019;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulseCore { from { transform: scale(0.95); } to { transform: scale(1.14); } }
  </style>
</head>
<body>
  <div class="hud-grid"></div>
  <div class="hud-container">
    <header class="hud-header">
      <div class="brand">
        <span class="brand-tag">STARK INDUSTRIES // MK-VII</span>
        <h1>J.A.R.V.I.S.</h1>
      </div>
      <div class="telemetry">
        <div class="status-pill" id="status-indicator">ONLINE</div>
        <button id="wake-btn" class="hud-btn-sm" title="Hey Jarvis Wake Mode">WAKE: OFF</button>
        <button id="auto-loop-btn" class="hud-btn-sm" title="Hands-Free Auto Mic">LOOP: OFF</button>
        <button id="clear-memory-btn" class="hud-btn-sm danger" title="Clear Memory">PURGE</button>
      </div>
    </header>

    <section class="core-section">
      <div class="arc-reactor" id="arc-reactor" title="Tap Reactor to Speak">
        <div class="ring outer-ring"></div>
        <div class="ring mid-ring"></div>
        <div class="ring inner-ring"></div>
        <div class="core-center"><span class="core-label">AI</span></div>
      </div>
      <div class="assistant-state" id="assistant-status">AWAITING YOUR COMMAND</div>
      <div class="sub-metrics">
        <span id="live-clock">--:-- IST</span>
        <span>•</span>
        <span>TOOLS: <b>15 ACTIVE</b></span>
        <span>•</span>
        <span>EYES: <b>READY</b></span>
      </div>
    </section>

    <main class="chat-panel">
      <div class="panel-header">
        <span>LIVE INTELLIGENCE LOG</span>
        <span class="live-dot">● ONLINE</span>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="message assistant-message">
          <div class="message-avatar">J</div>
          <div class="message-content">
            <span class="message-name">JARVIS</span>
            <p>All 15 tactical tools, Vision Eyes, and Wake Mode are calibrated, Sir. Tap the Reactor, camera, or mic to begin.</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="command-dock">
      <div class="quick-chips">
        <button type="button" class="chip-btn" data-cmd="What is the weather right now?">🌤 Weather</button>
        <button type="button" class="chip-btn" data-cmd="Latest tech news">📰 Tech News</button>
        <button type="button" class="chip-btn" data-cmd="Bitcoin price">₿ Bitcoin</button>
        <button type="button" class="chip-btn" data-cmd="Set a timer for 1 minute">⏱ 1m Timer</button>
        <button type="button" class="chip-btn" data-cmd="Generate a strong password">🔐 Password</button>
        <button type="button" class="chip-btn" data-cmd="Open YouTube">▶ YouTube</button>
      </div>
      <form id="chat-form" class="input-bar">
        <button type="button" id="mic-button" class="icon-btn" aria-label="Voice Command" title="Voice">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 0 0-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
          </svg>
        </button>
        <button type="button" id="cam-button" class="icon-btn" aria-label="Camera Vision" title="Scan with Camera">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
          </svg>
        </button>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" />
        <input type="text" id="user-input" placeholder="Say 'Hey Jarvis' or enter command..." autocomplete="off" />
        <button type="submit" id="send-button" class="send-btn">SEND</button>
      </form>
    </footer>
  </div>

  <script>
    const API_BASE = "https://jarvis-ai-brain.kumarswamiganga.workers.dev";
    const VOICE_LANGUAGE = "en-IN";
    const MEMORY_KEY = "JARVIS_CONVERSATION_MEMORY";
    const CLOUD_MEMORY_KEY = "JARVIS_CLOUD_MEMORY_ID";

    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const chatMessages = document.getElementById("chat-messages");
    const micButton = document.getElementById("mic-button");
    const camButton = document.getElementById("cam-button");
    const cameraInput = document.getElementById("camera-input");
    const sendButton = document.getElementById("send-button");
    const statusIndicator = document.getElementById("status-indicator");
    const assistantStatus = document.getElementById("assistant-status");
    const arcReactor = document.getElementById("arc-reactor");
    const clearMemoryBtn = document.getElementById("clear-memory-btn");
    const autoLoopBtn = document.getElementById("auto-loop-btn");
    const wakeBtn = document.getElementById("wake-btn");
    const liveClock = document.getElementById("live-clock");

    let conversationMemory = loadLocalMemory();
    let recognition = null;
    let isListening = false;
    let isBusy = false;
    let autoLoop = false;
    let wakeMode = false;

    function updateClock() {
      const now = new Date();
      liveClock.textContent = now.toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true,
      }).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    autoLoopBtn.addEventListener("click", () => {
      autoLoop = !autoLoop;
      autoLoopBtn.textContent = autoLoop ? "LOOP: ON" : "LOOP: OFF";
      autoLoopBtn.classList.toggle("active", autoLoop);
      if (autoLoop && !isListening && !isBusy && recognition) {
        try { recognition.start(); } catch (e) {}
      }
    });

    wakeBtn.addEventListener("click", () => {
      wakeMode = !wakeMode;
      wakeBtn.textContent = wakeMode ? "WAKE: ON" : "WAKE: OFF";
      wakeBtn.classList.toggle("active", wakeMode);
      if (wakeMode && !isListening && !isBusy && recognition) {
        setStatus("Listening for 'Hey Jarvis'...", "listening");
        try { recognition.start(); } catch (e) {}
      } else if (!wakeMode && isListening && recognition) {
        recognition.stop();
      }
    });

    document.querySelectorAll(".chip-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        sendMessage(btn.getAttribute("data-cmd"));
      });
    });

    function loadLocalMemory() {
      try {
        const saved = JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]");
        return Array.isArray(saved) ? saved.slice(-30) : [];
      } catch {
        return [];
      }
    }

    function saveLocalMemory() {
      localStorage.setItem(MEMORY_KEY, JSON.stringify(conversationMemory.slice(-30)));
    }

    function setStatus(message, mode = "idle") {
      if (assistantStatus) assistantStatus.textContent = message.toUpperCase();
      if (arcReactor) {
        arcReactor.classList.remove("listening", "thinking", "speaking");
        if (mode !== "idle") arcReactor.classList.add(mode);
      }
    }

    function renderBubble(message, sender, imageDataUrl = null) {
      const row = document.createElement("div");
      row.className = `message ${sender === "user" ? "user-message" : "assistant-message"}`;

      const avatar = document.createElement("div");
      avatar.className = "message-avatar";
      avatar.textContent = sender === "user" ? "S" : "J";

      const content = document.createElement("div");
      content.className = "message-content";

      const name = document.createElement("span");
      name.className = "message-name";
      name.textContent = sender === "user" ? "SIR" : "JARVIS";

      const paragraph = document.createElement("p");
      paragraph.textContent = message;

      content.appendChild(name);
      content.appendChild(paragraph);

      if (imageDataUrl) {
        const img = document.createElement("img");
        img.src = imageDataUrl;
        content.appendChild(img);
      }

      if (sender === "user") {
        row.appendChild(content);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(content);
      }

      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addMessage(message, sender, imageDataUrl = null) {
      renderBubble(message, sender, imageDataUrl);
      conversationMemory.push({
        role: sender === "user" ? "user" : "assistant",
        content: message,
      });
      conversationMemory = conversationMemory.slice(-30);
      saveLocalMemory();
      syncCloudMemory();
    }

    function buildGeminiContext() {
      return conversationMemory.slice(-20).map((item) => ({
        role: item.role,
        content: item.content,
      }));
    }

    // 15 Built-in Action Tools (Tool Router from Course Episode 6)
    async function runToolRouter(text) {
      const lower = text.toLowerCase().trim();

      // 1. Time & Date
      if (lower === "what is the time" || lower === "time" || lower === "current time") {
        const t = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
        return `The current time is ${t}, Sir.`;
      }
      if (lower === "what is the date" || lower === "today's date" || lower === "date") {
        const d = new Date().toLocaleDateString("en-IN", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
        return `Today is ${d}, Sir.`;
      }

      // 2. Countdown Timer
      const timerMatch = lower.match(/timer for (\d+)\s*(second|seconds|minute|minutes)/);
      if (timerMatch) {
        const amount = parseInt(timerMatch[1], 10);
        const unit = timerMatch[2];
        const ms = unit.startsWith("minute") ? amount * 60000 : amount * 1000;
        setTimeout(() => {
          const alertMsg = `Timer complete, Sir. Your ${amount} ${unit} countdown has finished.`;
          addMessage(alertMsg, "assistant");
          speakMessage(alertMsg);
        }, ms);
        return `Countdown timer set for ${amount} ${unit}, Sir. I will alert you when it completes.`;
      }

      // 3. Live Weather (Open-Meteo Free API)
      if (lower.includes("weather")) {
        try {
          const pos = await new Promise((resolve, reject) =>
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 })
          );
          const { latitude, longitude } = pos.coords;
          const res = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`
          );
          const data = await res.json();
          const w = data.current_weather;
          return `Current local temperature is ${w.temperature}°C with wind speeds of ${w.windspeed} km/h, Sir.`;
        } catch {
          const res = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=18.80&longitude=84.10&current_weather=true"
          );
          const data = await res.json();
          const w = data.current_weather;
          return `Regional temperature is ${w.temperature}°C with wind speeds of ${w.windspeed} km/h, Sir.`;
        }
      }

      // 4. Bitcoin Live Price (CoinGecko Free API)
      if (lower.includes("bitcoin")) {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,inr");
        const data = await res.json();
        return `Bitcoin is currently trading at $${data.bitcoin.usd.toLocaleString()} USD (₹${data.bitcoin.inr.toLocaleString()} INR), Sir.`;
      }

      // 5. USD to INR Currency Conversion
      const usdMatch = lower.match(/(\d+(?:\.\d+)?)\s*(?:usd|dollars?)\s*(?:to|in)\s*(?:inr|rupees?)/);
      if (usdMatch) {
        const amt = parseFloat(usdMatch[1]);
        const res = await fetch("https://open.er-api.com/v6/latest/USD");
        const data = await res.json();
        const inr = (amt * data.rates.INR).toFixed(2);
        return `${amt} US Dollars equals ₹${inr} Indian Rupees at the current exchange rate, Sir.`;
      }

      // 6. Live Tech News (HackerNews Free API)
      if (lower.includes("tech news") || lower === "news") {
        const topRes = await fetch("https://hacker-news.firebaseio.com/v0/topstories.json");
        const ids = (await topRes.json()).slice(0, 3);
        const stories = await Promise.all(
          ids.map((id) => fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then((r) => r.json()))
        );
        const headlines = stories.map((s, i) => `${i + 1}. ${s.title}`).join("\n");
        return `Here are the top 3 global technology headlines, Sir:\n${headlines}`;
      }

      // 7. Dictionary Meaning
      const defineMatch = lower.match(/^(?:define|meaning of)\s+([a-z]+)$/);
      if (defineMatch) {
        const word = defineMatch[1];
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        if (res.ok) {
          const data = await res.json();
          const def = data[0]?.meanings?.[0]?.definitions?.[0]?.definition;
          if (def) return `${word.toUpperCase()}: ${def}`;
        }
      }

      // 8. Strong Password Generator
      if (lower.includes("password")) {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
        let pass = "";
        for (let i = 0; i < 14; i++) pass += chars[Math.floor(Math.random() * chars.length)];
        return `Generated secure 14-character password, Sir:\n${pass}`;
      }

      // 9. Dice & Coin Flip
      if (lower.includes("flip a coin") || lower.includes("toss a coin")) {
        return `The coin landed on ${Math.random() < 0.5 ? "HEADS" : "TAILS"}, Sir.`;
      }
      if (lower.includes("roll a dice") || lower.includes("roll dice")) {
        return `You rolled a ${Math.floor(Math.random() * 6) + 1}, Sir.`;
      }

      // 10. Joke
      if (lower.includes("joke")) {
        const res = await fetch("https://official-joke-api.appspot.com/random_joke");
        const j = await res.json();
        return `${j.setup} — ${j.punchline}`;
      }

      // 11-15. App & Search Actions
      if (lower === "open youtube") {
        window.open("https://m.youtube.com", "_blank");
        return "Opening YouTube for you now, Sir.";
      }
      if (lower.startsWith("search youtube for ") || lower.startsWith("play ")) {
        const query = lower.startsWith("play ") ? text.slice(5) : text.slice(19);
        window.open(`https://m.youtube.com/results?search_query=${encodeURIComponent(query)}`, "_blank");
        return `Searching YouTube for ${query}, Sir.`;
      }
      if (lower === "open google maps" || lower === "open maps") {
        window.open("https://maps.google.com", "_blank");
        return "Launching Google Maps, Sir.";
      }
      if (lower.startsWith("search google for ") || lower.startsWith("google ")) {
        const query = lower.startsWith("google ") ? text.slice(7) : text.slice(18);
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
        return `Searching Google for ${query}, Sir.`;
      }

      return null;
    }

    async function sendMessage(message) {
      if (!message.trim() || isBusy) return;

      isBusy = true;
      userInput.value = "";
      sendButton.disabled = true;

      addMessage(message, "user");
      setStatus("Analyzing directive...", "thinking");

      try {
        const toolReply = await runToolRouter(message);
        if (toolReply) {
          addMessage(toolReply, "assistant");
          await speakMessage(toolReply);
          return;
        }

        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: buildGeminiContext(),
            memoryId: localStorage.getItem(CLOUD_MEMORY_KEY),
          }),
        });

        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || "AI service unavailable.");
        }

        const reply = data.reply || data.response || data.message;
        addMessage(reply, "assistant");
        await speakMessage(reply);
      } catch (error) {
        addMessage(`Core Error: ${error.message}`, "assistant");
        setStatus("Connection problem", "idle");
      } finally {
        isBusy = false;
        sendButton.disabled = false;
      }
    }

    // Camera Vision ("Eyes" from Course Episode 5)
    camButton.addEventListener("click", () => cameraInput.click());

    cameraInput.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file || isBusy) return;

      isBusy = true;
      sendButton.disabled = true;
      setStatus("Scanning visual input...", "thinking");

      try {
        const dataUrl = await compressImage(file, 900);
        const base64Data = dataUrl.split(",")[1];
        const promptText = userInput.value.trim() || "Analyze what you see in this image, Sir.";
        userInput.value = "";

        addMessage(promptText, "user", dataUrl);

        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: promptText,
            imageBase64: base64Data,
            imageMime: "image/jpeg",
          }),
        });

        const data = await response.json();
        if (!response.ok || data.success === false) {
          throw new Error(data.error || "Vision scan failed.");
        }

        addMessage(data.reply, "assistant");
        await speakMessage(data.reply);
      } catch (err) {
        addMessage(`Vision Error: ${err.message}`, "assistant");
        setStatus("Vision error", "idle");
      } finally {
        cameraInput.value = "";
        isBusy = false;
        sendButton.disabled = false;
      }
    });

    function compressImage(file, maxWidth) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.8));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(userInput.value);
    });

    function onFinishSpeaking() {
      setStatus(wakeMode ? "Listening for 'Hey Jarvis'..." : "Awaiting your command", "idle");
      if ((autoLoop || wakeMode) && recognition && !isListening) {
        setTimeout(() => {
          try { recognition.start(); } catch (e) {}
        }, 400);
      }
    }

    async function speakMessage(message) {
      try {
        setStatus("Speaking", "speaking");
        const response = await fetch(`${API_BASE}/speak`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message }),
        });

        if (!response.ok) throw new Error("ElevenLabs unavailable");

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);

        audio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          onFinishSpeaking();
        };
        audio.onerror = () => {
          URL.revokeObjectURL(audioUrl);
          onFinishSpeaking();
        };

        await audio.play();
      } catch {
        if ("speechSynthesis" in window) {
          const utter = new SpeechSynthesisUtterance(message);
          utter.rate = 1.02;
          utter.pitch = 0.95;
          utter.onend = onFinishSpeaking;
          window.speechSynthesis.speak(utter);
        } else {
          onFinishSpeaking();
        }
      }
    }

    function toggleListening() {
      if (!recognition) {
        alert("Voice recognition requires Chrome or Edge.");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch (e) {}
      }
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micButton.disabled = true;
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = VOICE_LANGUAGE;
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micButton.classList.add("listening");
        setStatus(wakeMode ? "Say 'Hey Jarvis'..." : "Listening...", "listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        const lower = transcript.toLowerCase();

        if (wakeMode) {
          if (lower.includes("jarvis")) {
            const cleaned = transcript.replace(/hey\s*jarvis[, ]*/i, "").trim();
            if (cleaned) {
              sendMessage(cleaned);
            } else {
              const greet = "Yes, Sir? I am listening.";
              addMessage(greet, "assistant");
              speakMessage(greet);
            }
          }
          return;
        }

        userInput.value = transcript;
        sendMessage(transcript);
      };

      recognition.onerror = () => {
        if (!wakeMode) setStatus("Microphone ready", "idle");
      };

      recognition.onend = () => {
        isListening = false;
        micButton.classList.remove("listening");
        if (!isBusy) {
          if (wakeMode) {
            setTimeout(() => {
              try { recognition.start(); } catch (e) {}
            }, 400);
          } else {
            setStatus("Awaiting your command", "idle");
          }
        }
      };
    }

    micButton.addEventListener("click", toggleListening);
    arcReactor.addEventListener("click", toggleListening);

    async function syncCloudMemory() {
      const memoryId = localStorage.getItem(CLOUD_MEMORY_KEY);
      try {
        const response = await fetch(`${API_BASE}/memory`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "save",
            memoryId,
            history: conversationMemory.slice(-30),
          }),
        });
        const data = await response.json();
        if (data.success && data.memoryId) {
          localStorage.setItem(CLOUD_MEMORY_KEY, data.memoryId);
        }
      } catch {}
    }

    async function loadCloudMemory() {
      const memoryId = localStorage.getItem(CLOUD_MEMORY_KEY);
      if (!memoryId) return;
      try {
        const response = await fetch(`${API_BASE}/memory`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "load", memoryId }),
        });
        const data = await response.json();
        if (data.success && Array.isArray(data.history) && data.history.length) {
          conversationMemory = data.history.slice(-30);
          saveLocalMemory();
        }
      } catch {}
    }

    function restoreChat() {
      if (!conversationMemory.length) return;
      chatMessages.innerHTML = "";
      conversationMemory.slice(-20).forEach((item) => {
        renderBubble(item.content, item.role === "user" ? "user" : "assistant");
      });
    }

    clearMemoryBtn.addEventListener("click", () => {
      localStorage.removeItem(MEMORY_KEY);
      localStorage.removeItem(CLOUD_MEMORY_KEY);
      conversationMemory = [];
      chatMessages.innerHTML = "";
      renderBubble("Memory banks purged, Sir. Ready for new directives.", "assistant");
    });

    async function initializeJarvis() {
      setupSpeechRecognition();
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        statusIndicator.textContent = data.success ? "ONLINE" : "CHECK";
      } catch {
        statusIndicator.textContent = "OFFLINE";
      }

      await loadCloudMemory();
      restoreChat();
      setStatus("Awaiting your command", "idle");
    }

    initializeJarvis();
  </script>
</body>
